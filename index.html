<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DL入出庫明細與庫存管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PapaParse for robust CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 text-white rounded-lg shadow-sm">
                    <i data-lucide="boxes" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-none">DL入出庫明細與庫存系統</h1>
                    <span class="text-xs text-slate-500">Inventory & BOM Reconciliation System</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- 權限模式標籤 -->
                <span id="role-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 flex items-center space-x-1">
                    <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                    <span>請先登入</span>
                </span>

                <!-- 管理員解鎖 / 切換按鈕 -->
                <button id="btn-admin-toggle" onclick="toggleAdminMode()" class="flex items-center space-x-1 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-300 bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
                    <i id="admin-icon" data-lucide="lock" class="w-3.5 h-3.5"></i>
                    <span id="admin-btn-text">Google 登入</span>
                </button>

                <button id="btn-export-backup" onclick="exportCloudBackup()" class="owner-only hidden px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium">匯出 JSON 備份</button>
                <button id="btn-users" onclick="manageUserRole()" class="owner-only hidden px-3 py-2 rounded-lg bg-slate-700 hover:bg-slate-800 text-white text-xs font-medium">人員權限</button>
                <label class="owner-only hidden cursor-pointer px-3 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium">
                    匯入舊資料
                    <input id="legacy-json-input" type="file" accept=".json,application/json" onchange="importLegacyFile(event)" class="hidden">
                </label>
                <!-- 新增明細按鈕 (僅管理員可見) -->
                <button id="btn-add-record" onclick="openModal()" class="hidden flex items-center space-x-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium text-sm transition shadow-sm hover:shadow">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>新增明細</span>
                </button>
            </div>
        </div>
    </header>

    <div id="app-message" role="status" class="hidden fixed top-20 right-4 z-50 max-w-lg rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm shadow-lg"></div>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- 數據統計卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
                    <i data-lucide="list" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium">總記錄數</p>
                    <h3 id="stat-total-count" class="text-2xl font-bold text-slate-800">0 <span class="text-xs font-normal text-slate-500">筆</span></h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg">
                    <i data-lucide="arrow-down-left" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium">總入庫量</p>
                    <h3 id="stat-total-in" class="text-2xl font-bold text-emerald-600">0</h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                <div class="p-3 bg-rose-50 text-rose-600 rounded-lg">
                    <i data-lucide="arrow-up-right" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium">總出貨量</p>
                    <h3 id="stat-total-out" class="text-2xl font-bold text-rose-600">0</h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                <div class="p-3 bg-amber-50 text-amber-600 rounded-lg">
                    <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium">目標缺數項目</p>
                    <h3 id="stat-shortage-count" class="text-2xl font-bold text-amber-600">0 <span class="text-xs font-normal text-slate-500">項</span></h3>
                </div>
            </div>
        </div>

        <!-- 頁籤選單 -->
        <div class="border-b border-slate-200 flex space-x-4">
            <button id="tab-records-btn" onclick="switchTab('records')" class="pb-3 px-1 border-b-2 border-indigo-600 text-indigo-600 font-bold text-sm flex items-center space-x-2">
                <i data-lucide="file-text" class="w-4 h-4"></i>
                <span>明細紀錄列表</span>
            </button>
            <button id="tab-stock-btn" onclick="switchTab('stock')" class="pb-3 px-1 border-b-2 border-transparent text-slate-500 hover:text-slate-700 font-medium text-sm flex items-center space-x-2">
                <i data-lucide="package-check" class="w-4 h-4"></i>
                <span>依料號庫存統計</span>
            </button>
            <button id="tab-bom-btn" onclick="switchTab('bom')" class="pb-3 px-1 border-b-2 border-transparent text-slate-500 hover:text-slate-700 font-medium text-sm flex items-center space-x-2">
                <i data-lucide="clipboard-check" class="w-4 h-4"></i>
                <span>缺數明細</span>
            </button>
        </div>

        <!-- 分頁 1: 明細紀錄列表 -->
        <div id="tab-records-view" class="space-y-4">
            <!-- 篩選列 -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex flex-1 flex-col sm:flex-row items-center gap-3">
                    <div class="relative flex-1 w-full sm:w-auto">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="filter-search" oninput="applyFilters()" placeholder="搜尋..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <select id="filter-record-project" onchange="applyFilters()" class="w-full sm:w-auto px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-600">
                        <option value="ALL">全部專案</option>
                    </select>

                    <select id="filter-type" onchange="applyFilters()" class="w-full sm:w-auto px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-600">
                        <option value="ALL">全部類型</option>
                        <option value="IN">入庫 (IN)</option>
                        <option value="OUT">出庫 (OUT)</option>
                    </select>

                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <input type="date" id="filter-date-start" onchange="applyFilters()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-600">
                        <span class="text-slate-400 text-xs">至</span>
                        <input type="date" id="filter-date-end" onchange="applyFilters()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-600">
                    </div>
                </div>

                <div class="flex flex-wrap items-center gap-2 self-end md:self-auto">
                    <label class="admin-only hidden cursor-pointer px-3 py-2 border border-emerald-200 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-medium">匯入明細 CSV<input type="file" accept=".csv,text/csv" onchange="handleRecordImport(event)" class="hidden"></label>
                    <button onclick="exportSelectedRecords()" class="px-3 py-2 border border-indigo-200 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-medium flex items-center space-x-1 transition">
                        <i data-lucide
